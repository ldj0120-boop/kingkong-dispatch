<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#DDE2E9"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="킹콩배차"><meta name="color-scheme" content="light">
<title>킹콩 물류 배차·정산</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* 밝은 화면 — PLT 출고 관리(kingkong) 사이트와 같은 색 · 글꼴 · 둥근 카드 */
  color-scheme: light;
  --bg:#DDE2E9; --panel:#FAFBFC; --panel2:#F0F2F5; --raise:#E6E9EE; --line:#D5DAE2; --line2:#E3E7ED;
  --text:#111318; --muted:#3F4354; --muted2:#5A5E70;
  --brand:#3B3FD8; --brand-ink:#FFFFFF; --brand-soft:#ECECFF; --ink-btn:#15161A;
  --t1:#3B3FD8; --t2:#0E7490; --t3:#C2410C;       /* 유형 색: 쿠팡(남색) · 센터/본사(청록 — 운행 완료 초록과 구분) · 고객배송(주황) */
  --up:#C8232F; --down:#1F5AE6; --good:#0B7A3B; --warn:#A16207; --bad:#C8232F;
  --s-req:#A16207; --s-asg:#1F5AE6; --s-done:#0B7A3B; --s-conf:#5B21B6; --s-can:#6B7080;
  --radius:20px; --shadow:0 1px 2px rgba(17,19,24,.04);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 "Gothic A1",Inter,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted2)}
.hidden{display:none!important}

/* ---------- 상단 ---------- */
.top{position:sticky;top:0;z-index:20;padding:12px 20px 0;background:linear-gradient(var(--bg) 70%,transparent)}
.top-in{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:12px 18px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line2);border-radius:var(--radius)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;white-space:nowrap}
.brand .logo{width:36px;height:36px;border-radius:11px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center}
.brand small{font-weight:500;font-size:12px;color:var(--muted2);display:block;line-height:1.1}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav button{border:0;background:transparent;padding:8px 13px;border-radius:99px;font-weight:700;color:var(--muted)}
.nav button[aria-current="page"]{background:var(--ink-btn);color:#fff}
.nav button:hover{background:var(--panel2)}
.top .sp{flex:1}
.mode-badge{font-size:12px;font-weight:700;padding:5px 11px;border-radius:99px;background:#E3F6EA;color:var(--good);white-space:nowrap}
.mode-badge.demo{background:#FEF3C7;color:#92400E}
.build-pill{display:inline-block;font-size:11px;font-weight:700;color:var(--brand);border:1px solid var(--brand);border-radius:99px;padding:0 7px;margin-left:4px;vertical-align:1px}
main{max-width:1320px;margin:0 auto;padding:20px}

/* ---------- 공통 카드 ---------- */
.card{background:var(--panel);border:1px solid var(--line2);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.card h2{margin:0 0 4px;font-size:18px}
.card .sub{margin:0 0 14px;color:var(--muted2);font-size:13.5px}
.grid{display:grid;gap:14px}
.grid > *{min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:9px 14px;font-weight:700;min-height:40px}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13px}
.btn.danger{color:var(--bad)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12.5px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:9px 11px;min-height:42px;width:100%}
.field textarea{min-height:90px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:var(--brand)}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap;border:1px solid currentColor}
.tag.t-coupang{color:var(--t1)} .tag.t-center{color:var(--t2)} .tag.t-delivery{color:var(--t3)}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;white-space:nowrap}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.st.requested{color:var(--s-req)} .st.assigned{color:var(--s-asg)} .st.done{color:var(--s-done)} .st.confirmed{color:var(--s-conf)} .st.canceled{color:var(--s-can)}
.empty{padding:30px;text-align:center;color:var(--muted2)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink-btn);color:#fff;padding:11px 18px;border-radius:10px;font-weight:700;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw}

/* ---------- 대시보드 ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line2);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.kpi .l{font-size:13px;font-weight:700;color:var(--muted)}
.kpi .v{font-size:24px;font-weight:800;margin-top:2px;letter-spacing:-.01em}
.kpi .s{font-size:12.5px;color:var(--muted2)}
.kpi.alert .v{color:var(--bad)}
.kpi.clickable{cursor:pointer} .kpi.clickable:hover{border-color:var(--brand)}
.board{display:grid;grid-template-columns:140px repeat(4,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.board > div{padding:10px 12px;border-bottom:1px solid var(--line2);border-right:1px solid var(--line2);background:var(--panel)}
.board .h{background:var(--panel2);font-size:12.5px;font-weight:700;color:var(--muted)}
.board .c{font-weight:800;font-size:18px;cursor:pointer} .board .c:hover{background:var(--brand-soft)}
.board .c small{display:block;font-weight:500;font-size:12px;color:var(--muted2)}
.bars{display:flex;flex-direction:column;gap:8px}
.bar-row{display:grid;grid-template-columns:150px 1fr 120px;gap:10px;align-items:center;font-size:13.5px}
.bar-row .track{height:18px;background:var(--panel2);border-radius:5px;overflow:hidden;display:flex}
.bar-row .track i{display:block;height:100%}
.bar-row .v{text-align:right;font-weight:700}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.cols{display:flex;align-items:flex-end;gap:3px;height:160px;border-bottom:1px solid var(--line);padding-top:8px}
.cols .c{flex:1;display:flex;flex-direction:column-reverse;min-width:0;cursor:default}
.cols .c i{display:block}
.cols-ax{display:flex;gap:3px;font-size:11px;color:var(--muted2);margin-top:4px}
.cols-ax span{flex:1;text-align:center;min-width:0}
.two{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}
.alerts li{margin:6px 0}

/* ---------- 표 ---------- */
.tbl-wrap{overflow:auto;border:1px solid var(--line2);border-radius:14px;background:var(--panel);max-height:calc(100vh - 260px)}
table.tbl{border-collapse:collapse;width:100%;font-size:13.5px}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line2);text-align:left;white-space:nowrap}
.tbl th{position:sticky;top:0;background:var(--panel2);font-size:12.5px;color:var(--muted);z-index:1}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tbody tr{cursor:pointer} .tbl tbody tr:hover td{background:var(--brand-soft)}
.tbl tfoot td{font-weight:800;background:var(--panel2);position:sticky;bottom:0}
.diff-up{color:var(--up);font-weight:700}
.flag{font-size:11.5px;font-weight:700;color:var(--warn);border:1px solid currentColor;border-radius:99px;padding:0 6px;margin-left:4px}

/* ---------- 유형 고르기 ---------- */
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.type-card{border:2px solid var(--line2);border-radius:var(--radius);background:var(--panel);padding:16px;text-align:left}
.type-card b{display:block;font-size:16px;margin-bottom:4px}
.type-card span{font-size:13px;color:var(--muted2)}
.type-card[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.lines{display:flex;flex-direction:column;gap:8px}
.line{display:grid;grid-template-columns:1.4fr .6fr 1fr 40px;gap:8px;align-items:end}

/* ---------- 오른쪽 편집 서랍 ---------- */
.drawer-bg{position:fixed;inset:0;background:rgba(10,12,18,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--panel);z-index:41;display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(0,0,0,.2)}
.drawer header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.drawer header h3{margin:0;font-size:17px;flex:1}
.drawer .body{padding:16px 18px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:16px}
.drawer footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.sec-t{font-size:13px;font-weight:800;color:var(--muted);margin:0 0 8px;letter-spacing:.02em}
.log{font-size:12.5px;color:var(--muted2)}

/* ---------- 업체(모바일) 화면 ---------- */
.m{max-width:640px;margin:0 auto;padding:0 0 110px}
.m-head{position:sticky;top:0;z-index:10;background:var(--panel);color:var(--text);padding:14px 16px 12px;border-bottom:1px solid var(--line2);border-radius:0 0 22px 22px}
.m-head .who{font-size:13px;color:var(--muted2)}
.m-head .ttl{font-size:19px;font-weight:800}
.m-tabs{display:flex;gap:6px;margin-top:10px;overflow:auto}
.m-tabs button{border:1px solid var(--line);border-radius:99px;padding:8px 14px;font-weight:700;background:var(--panel2);color:var(--muted);white-space:nowrap;min-height:38px}
.m-tabs button[aria-pressed="true"]{background:var(--ink-btn);border-color:var(--ink-btn);color:#fff}
.m-days{display:flex;gap:6px;padding:10px 12px;overflow:auto}
.m-days button{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:6px 12px;font-weight:700;font-size:13.5px;white-space:nowrap;min-height:36px}
.m-days button[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.m-list{padding:12px;display:flex;flex-direction:column;gap:10px}
.m-date{font-size:13px;font-weight:800;color:var(--muted);margin:8px 2px 0}
.m-card{background:var(--panel);border:1px solid var(--line2);border-left:5px solid var(--line);border-radius:16px;padding:12px 14px;text-align:left;width:100%;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.m-card.t-coupang{border-left-color:var(--t1)} .m-card.t-center{border-left-color:var(--t2)} .m-card.t-delivery{border-left-color:var(--t3)}
.m-card .route{font-size:17px;font-weight:800;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.m-card .route .arw{color:var(--muted2);font-weight:500}
.m-card .meta{display:flex;gap:10px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.m-card .need{color:var(--s-req);font-weight:800}
.m-card .amt{font-weight:800;color:var(--text)}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));background:var(--brand);color:var(--brand-ink);border:0;border-radius:99px;padding:15px 20px;font-weight:800;box-shadow:0 8px 22px rgba(59,63,216,.35);z-index:15}
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
.sheet header{background:var(--panel);border-bottom:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;gap:10px}
.sheet header h3{margin:0;font-size:17px;flex:1}
.sheet .body{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:14px;max-width:640px;width:100%;margin:0 auto}
.sheet footer{background:var(--panel);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;max-width:640px;width:100%;margin:0 auto}
.sheet footer .btn{flex:1;min-height:52px;font-size:16px}
.req-box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px}
.req-box .route{font-size:18px;font-weight:800}
.big .field input,.big .field select,.big .field textarea{min-height:52px;font-size:17px;border-radius:11px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:8px 13px;font-weight:700;min-height:42px}
.chips button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.total{background:var(--panel);border:2px solid var(--brand);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
.total b{font-size:24px}
.hint{font-size:12.5px;color:var(--muted2)}
.hint.warn{color:var(--warn);font-weight:700}
.build{text-align:center;font-size:12px;color:var(--muted2);margin:8px 0 0}
.pin{min-height:100vh;display:grid;place-items:center;padding:20px}
.pin .card{width:min(380px,100%);text-align:center}
.pin input{font-size:28px;letter-spacing:.4em;text-align:center}

/* ---------- 이력(타임라인) · 취소/회차 표시 ---------- */
.evb{display:inline-flex;font-size:11.5px;font-weight:800;border-radius:99px;padding:1px 7px;margin-left:4px;white-space:nowrap}
.ev-c{background:#FDE7E9;color:#A3121F} .ev-r{background:#FFF1DB;color:#8A4B00} .ev-ch{background:#E6EEFF;color:#1F4FB8}
.st-flag{color:var(--t3)}
.tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:10px;font-size:13.5px}
.tl li{position:relative}
.tl li::before{content:"";position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--muted2);border:2px solid var(--panel)}
.tl .tl-h{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.tl .tl-r{font-weight:700}
.tl li.k-request::before{background:var(--s-req)} .tl li.k-assign::before,.tl li.k-reassign::before{background:var(--s-asg)}
.tl li.k-done::before{background:var(--s-done)} .tl li.k-cancel_driver::before,.tl li.k-cancel::before{background:var(--bad)} .tl li.k-return::before{background:var(--warn)} .tl li.k-change::before{background:var(--down)}
.tl li.k-cancel_driver b,.tl li.k-cancel b{color:var(--bad)} .tl li.k-return b{color:var(--warn)}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;font-size:13.5px;max-height:330px;overflow:auto}
.feed li{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline;padding:6px 8px;border-radius:8px;cursor:pointer;border-left:3px solid var(--line)}
.feed li:hover{background:var(--brand-soft)}
.feed .ft{font-variant-numeric:tabular-nums;color:var(--muted2);font-size:12.5px}
.feed li.k-cancel_driver,.feed li.k-cancel{border-left-color:var(--bad)} .feed li.k-return{border-left-color:var(--warn)} .feed li.k-done{border-left-color:var(--s-done)} .feed li.k-assign,.feed li.k-reassign{border-left-color:var(--s-asg)}
.ev-box{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:12px 14px}
.ev-box .btn{flex:1;min-height:46px}
.live-pill{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:60;border:0;border-radius:99px;background:var(--brand);color:var(--brand-ink);font-weight:800;padding:10px 18px;box-shadow:0 8px 22px rgba(0,0,0,.25)}
.toast.act{display:flex;gap:12px;align-items:center;width:max-content;max-width:calc(100vw - 24px)}
.toast.act span{min-width:0} .toast.act .btn{white-space:nowrap;flex:none}
.toast.act .btn{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}

/* ---------- 붙여넣기 ---------- */
.imp-card textarea{font-size:13.5px}
.imp .tbl td{padding:4px 5px}
.imp .tbl input,.imp .tbl select{border:1px solid var(--line);border-radius:6px;padding:4px 6px;min-height:32px;background:var(--panel);width:100%;min-width:70px}
.imp .tbl tbody tr{cursor:default} .imp .tbl tbody tr:hover td{background:transparent}
.imp tr.dup td{background:var(--panel2)}
.plan{display:flex;flex-direction:column;gap:8px}
.plan-it{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--s-asg);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.plan-it.k-cancel_driver{border-left-color:var(--bad)} .plan-it.k-return{border-left-color:var(--warn)} .plan-it.k-change{border-left-color:var(--down)}
.plan-it select{border:1px solid var(--line);border-radius:8px;padding:8px;min-height:42px;background:var(--panel);width:100%}
.paste-btn{display:flex;gap:6px;margin:8px 0 4px;flex-wrap:wrap}
.paste-btn .btn{flex:1;min-height:38px}


/* ---------- 고객배송 요청서 보기 · 매장 화면 ---------- */
.kvs{display:grid;gap:6px;font-size:14px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:10px}
.kv > span{color:var(--muted2);font-size:13px;font-weight:700}
.m-head.store{border-top:5px solid var(--t3)}
.sheet section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.ff{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:4px 0}
.ff > span:first-child{min-width:120px;font-weight:700;font-size:14px;color:var(--muted)}
.ff input{border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:44px;width:110px;background:var(--panel)}
.ff input[type=date]{width:auto}
.item-row{display:grid;grid-template-columns:1fr 64px auto 36px;gap:6px;align-items:center;margin-bottom:6px}
.item-row input{border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:46px;background:var(--panel);width:100%}
.check{display:flex;gap:10px;align-items:center;font-size:15px;padding:6px 0}
.check input{width:22px;height:22px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative;width:88px;height:88px;border-radius:10px;overflow:hidden;border:1px solid var(--line);padding:0;background:var(--panel2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:2px;right:2px;border:0;border-radius:99px;background:rgba(0,0,0,.6);color:#fff;width:24px;height:24px;font-size:12px}
.lightbox{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px}
.lightbox img{max-width:100%;max-height:85vh;border-radius:8px}

/* ---------- 비고(질문) · 수정 기록 · 양식 ---------- */
.ev-q{background:#FDE7E9;color:#A3121F} .ev-a{background:#E3F6EA;color:#0B5E2E}
.thread{display:flex;flex-direction:column;gap:8px}
.msg{background:var(--panel2);border-radius:14px;padding:9px 12px;font-size:14px;max-width:92%}
.msg.a{background:#E6EEFF;align-self:flex-end} .msg.closed{opacity:.6}
.msg .mh{display:flex;gap:8px;justify-content:space-between;font-size:12.5px;margin-bottom:2px}
.q-input{flex:1;border:1px solid var(--line);border-radius:99px;padding:9px 14px;min-height:42px;background:var(--panel);min-width:0}
